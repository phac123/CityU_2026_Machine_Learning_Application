name: llm
data:
  name: qm9
  root: ${oc.env:DATA_DIR,./data}/qm9
  limit: null
  max_len: 64
  min_token_count: 1
  max_vocab: 256
  n_cond_bins: 0
  randomize: true
  num_workers: 0
  batch_size: 8
  eval_batch_size: 64
  fold: -1
  n_folds: 3
  valid_limit: 512
  valid_batches: 8
model:
  d_model: 256
  n_head: 8
  n_layer: 6
  dropout: 0.1
  tie_embeddings: true
train:
  max_steps: 20
  lr: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  amp: bf16
  seed: 0
  log_every: 1
  eta_window: 50
  progress_every: 1
  heartbeat_seconds: 30
  eval_every: 20
  ckpt_every: 20
  ckpt_keep_all: false
  analysis_every: 0
  analysis_num: 128
  analysis_pca: true
  analysis_save_samples: true
  skip_training: false
  sample_num: 128
  sample_temperature: 0.9
  sample_top_k: 50
  out_dir: ${hydra:runtime.output_dir}
  resume: false
seed: 0
smoke: false
ddp:
  backend: null
  timeout_minutes: 2
  find_unused_parameters: true
eval:
  ckpt: null
  num: 1024
  steps: null
  eta: null
  temperature: null
  top_k: null
  cond: null
  batch_size: 64
  use_ema: false
  seed: 0
  conformers: false
  out: null
  xyz_out: null
  json_out: null
