# Cross-validation grid for the EDM branch (`python cv.py method=edm +cv=edm`).
# @package _global_
cv:
  folds: [0, 1, 2]
  n_folds: 3
  budget:
    max_steps: 500
    limit: 4000
    valid_limit: 512
    valid_batches: 8
    lr: 0.0002
  candidates:
    - name: base
      overrides: {}
    - name: lr_high
      overrides: {train.lr: 0.0005}
    - name: lr_low
      overrides: {train.lr: 0.0001}
    - name: no_snr
      overrides: {diffusion.loss_weight: none}
    - name: layers6
      overrides: {model.n_layers: 6}
